name: Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-check.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Migration Files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check migration naming convention
        run: |
          INVALID=$(find supabase/migrations -name "*.sql" | \
            grep -vE '/[0-9]{5}_[a-z][a-z0-9_]*\.sql$' || true)
          if [ -n "$INVALID" ]; then
            echo "ERROR: Invalid migration filenames:"
            echo "$INVALID"
            echo "Expected format: NNNNN_description_words.sql (5 digits, lowercase, underscores)"
            exit 1
          fi
          echo "All migration filenames valid."

      - name: Check for duplicate migration numbers
        run: |
          DUPES=$(find supabase/migrations -name "*.sql" | \
            sed 's|.*/\([0-9]\{5\}\)_.*|\1|' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "ERROR: Duplicate migration numbers found: $DUPES"
            exit 1
          fi
          echo "No duplicate migration numbers."

      - name: Report migration count
        run: |
          COUNT=$(find supabase/migrations -name "*.sql" | wc -l | tr -d ' ')
          echo "Total migrations: $COUNT"
          echo "Next migration number: $(printf '%05d' $((COUNT + 1)))"

  deploy:
    name: Push Migrations to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.98.2

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dry-run migration push
        run: |
          supabase db push --dry-run 2>&1 | tee /tmp/migration-diff.txt
          echo "## Migration Dry-Run Diff" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/migration-diff.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
